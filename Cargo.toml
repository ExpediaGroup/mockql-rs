[profile.release]
strip = true

[workspace]
resolver = "2"
members = ["crates/mockql-core", "crates/mockql-cli", "xtask"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
documentation = "https://opensource.expediagroup.com/mockql-rs"
homepage = "https://opensource.expediagroup.com/mockql-rs"
repository = "https://github.com/ExpediaGroup/mockql-rs"

[workspace.dependencies]
apollo-compiler = "1.32.0"
axum = "0.8.9"
buildstructor = "0.6.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
cynic = { version = "3.13.2", features = ["http-reqwest"] }
cynic-introspection = "3.13.2"
humantime = "2.3.0"
insta = { version = "1.47.2", features = ["glob"] }
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
schemars = { version = "1.2.1", features = ["url2"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
serde_json_bytes = { version = "0.2.5", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toon-format = { version = "0.5.0", default-features = false }
