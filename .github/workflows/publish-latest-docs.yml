---
name: Publish Latest Docs

on:
  push:
    branches: [main]
    paths: ['mdbook/**']
  workflow_dispatch:
    inputs:
      destination_dir:
        description: 'Archive to a top-level versioned subdirectory (e.g. v1). Leave empty to deploy to root.'
        required: false
        default: ''

jobs:
  publish-docs:
    permissions:
      contents: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.repository == 'ExpediaGroup/mockql-rs'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: 'latest'

      - name: Build docs
        run: cd mdbook && mdbook build

      - name: Resolve Pages deploy options
        id: pages
        env:
          DESTINATION_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.destination_dir || '' }}
        run: |
          set -euo pipefail

          if [[ -n "${DESTINATION_DIR}" && ! "${DESTINATION_DIR}" =~ ^v[0-9]+$ ]]; then
            echo "::error::destination_dir must be empty or a top-level major-version archive like v1"
            exit 1
          fi

          has_versioned_archives=false
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
            if git ls-tree -d --name-only origin/gh-pages | grep -Eq '^v[0-9]+$'; then
              has_versioned_archives=true
            fi
          fi

          keep_files=false
          if [[ -n "${DESTINATION_DIR}" || "${has_versioned_archives}" == "true" ]]; then
            keep_files=true
          fi

          echo "destination_dir=${DESTINATION_DIR}" >> "$GITHUB_OUTPUT"
          echo "keep_files=${keep_files}" >> "$GITHUB_OUTPUT"

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d231e62369d3b44e6 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mdbook/book
          destination_dir: ${{ steps.pages.outputs.destination_dir }}
          # Root deploys can delete stale Docusaurus output only before versioned archives exist.
          # Once v1/, v2/, ... exists on gh-pages, preserve it automatically on every root deploy.
          keep_files: ${{ steps.pages.outputs.keep_files }}
          user_name: eg-oss-ci
          user_email: oss@expediagroup.com
