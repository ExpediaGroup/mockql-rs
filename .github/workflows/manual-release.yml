name: Manual Release Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to simulate (e.g. 0.1.0)'
        required: true


env:
  RUST_VERSION: "1.95.0"

jobs:
  build:
    name: Build (linux-amd64)
    runs-on: eg-default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Compile dependencies
        run: |
          echo '' > crates/mockql-core/src/lib.rs
          echo 'fn main() {}' > crates/mockql-cli/src/main.rs
          echo 'fn main() {}' > xtask/src/main.rs
          cargo build --release --target x86_64-unknown-linux-gnu
          git checkout .

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package binary
        run: |
          ARCHIVE_NAME="mockql-rs-${{ inputs.version }}-linux-amd64"
          mkdir -p "${ARCHIVE_NAME}"
          cp target/x86_64-unknown-linux-gnu/release/mockql "${ARCHIVE_NAME}/"
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: mockql-rs-linux-amd64
          path: "*.zip"
