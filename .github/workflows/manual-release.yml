name: Manual Release Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to simulate (e.g. 0.1.0)'
        required: true


env:
  RUST_VERSION: "1.95.0"

permissions:
  contents: read

jobs:
  build:
    name: Build (linux-amd64)
    runs-on: eg-default
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Install Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Compile dependencies
        run: |
          echo '' > crates/mockql-core/src/lib.rs
          echo 'fn main() {}' > crates/mockql-cli/src/main.rs
          echo 'fn main() {}' > xtask/src/main.rs
          cargo build --release --target x86_64-unknown-linux-gnu
          git checkout .

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package binary
        run: |
          ARCHIVE_NAME="mockql-rs-${{ inputs.version }}-linux-amd64"
          mkdir -p "${ARCHIVE_NAME}"
          cp target/x86_64-unknown-linux-gnu/release/mockql "${ARCHIVE_NAME}/"
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mockql-rs-linux-amd64
          path: "*.zip"
