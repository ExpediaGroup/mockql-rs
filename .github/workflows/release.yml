---
name: Release

on:
  release:
    types: [published]

env:
  RUST_VERSION: "1.95.0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: ${{ matrix.target }}

      - name: Compile dependencies
        run: |
          echo '' > crates/mockql-core/src/lib.rs
          echo 'fn main() {}' > crates/mockql-cli/src/main.rs
          echo 'fn main() {}' > xtask/src/main.rs
          cargo build --release --target ${{ matrix.target }}
          git checkout .

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="mockql-rs-${{ github.event.release.tag_name }}-${TARGET}"
          BINARY="target/${TARGET}/release/mockql"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="${BINARY}.exe"
          fi

          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "${BINARY}" "dist/${ARCHIVE_NAME}/"
          tar -czf "${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mockql-rs-${{ matrix.target }}
          path: "*.tar.gz"
          if-no-files-found: error

  publish-github:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          sha256sum ./*.tar.gz > sha256sums.txt
          sha1sum ./*.tar.gz > sha1sums.txt
          md5sum ./*.tar.gz > md5sums.txt

      - name: Upload binaries to release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/*.tar.gz
            artifacts/md5sums.txt
            artifacts/sha1sums.txt
            artifacts/sha256sums.txt


  publish-cargo:
    name: Publish Cargo crates
    needs: publish-github
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo publish -p mockql-core

          for attempt in 1 2 3 4 5; do
            if cargo publish -p mockql-cli; then
              exit 0
            fi

            echo "mockql-cli publish failed, retrying after crates.io index catches up (${attempt}/5)"
            sleep 30
          done

          exit 1
