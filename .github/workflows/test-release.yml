---
name: Test release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  RUST_VERSION: "1.95.0"

jobs:
  build_release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          shared-key: ${{ matrix.target }}

      - name: Compile dependencies
        run: |
          echo '' > crates/mockql-core/src/lib.rs
          echo 'fn main() {}' > crates/mockql-cli/src/main.rs
          echo 'fn main() {}' > xtask/src/main.rs
          cargo build --release --target ${{ matrix.target }}
          git checkout .

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="mockql-rs-v${VERSION}-${TARGET}"
          BINARY="target/${TARGET}/release/mockql"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="${BINARY}.exe"
          fi

          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "${BINARY}" "dist/${ARCHIVE_NAME}/"
          tar -czf "${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mockql-rs-${{ matrix.target }}
          path: "*.tar.gz"
          if-no-files-found: error

  publish_release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build_release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mockql-rs-*
          merge-multiple: true

      - name: Create checksums
        run: |
          sha256sum ./*.tar.gz > sha256sums.txt
          sha1sum ./*.tar.gz > sha1sums.txt
          md5sum ./*.tar.gz > md5sums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ inputs.version }}"
          gh release create "${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "${VERSION}" \
            --target "${{ github.sha }}" \
            --notes "" \
            ./*.tar.gz \
            md5sums.txt \
            sha1sums.txt \
            sha256sums.txt
