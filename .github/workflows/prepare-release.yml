---
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true

env:
  RUST_VERSION: "1.96.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"

          if [[ "${VERSION}" == v* ]]; then
            echo "Release preparation version must not start with v: ${VERSION}"
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release preparation version must be semver-like: ${VERSION}"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Prepare release
        run: cargo xtask release prepare ${{ inputs.version }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/${{ inputs.version }}
          delete-branch: true
          title: "chore(release): prepare v${{ inputs.version }}"
          commit-message: "chore(release): prepare v${{ inputs.version }}"
          body: |
            Prepare release v${{ inputs.version }}.

            This PR was generated by the Prepare release workflow.
