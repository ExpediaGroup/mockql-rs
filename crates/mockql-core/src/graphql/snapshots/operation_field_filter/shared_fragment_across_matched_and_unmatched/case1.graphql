# mock_paths: ["topProducts.reviews"]
query GetProducts {
  topProducts(first: 5) {
    name
    reviews @mock(hint: "positive reviews") {
      ...ReviewFields
    }
  }
  recommendedProducts {
    name
    reviews {
      ...ReviewFields
    }
  }
}

fragment ReviewFields on Review {
  id
  body
  rating
}
