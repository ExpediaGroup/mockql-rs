# mock_paths: ["me.name", "me.username", "me.reviews", "me", "topProducts.upc", "topProducts"]
query {
  me @mock {
    id
    name @mock(hint: "celebrity name")
    username @mock(hint: "unique username")
    reviews @mock {
      id
      body
    }
  }
  recommendedProducts {
    upc
    name
  }
  topProducts(first: 5) @mock(hint: "popular products") {
    name
    upc @mock(hint: "identifier starting with prd-")
  }
}
